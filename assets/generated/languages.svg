<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace">
<style>
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%{r:9;opacity:.7}100%{r:22;opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-60}}
  @keyframes twinkle{0%,100%{opacity:var(--o)}50%{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .a{opacity:0;animation:fade .5s ease forwards}
  .u{opacity:0;animation:up .6s ease forwards;transform-box:fill-box}
  
</style>
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1a2236" stroke-width=".6"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e3d26f" stop-opacity=".18"/><stop offset="1" stop-color="#e3d26f" stop-opacity="0"/></radialGradient>
  <linearGradient id="nameg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5ee6eb"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="899" height="199" rx="16" fill="#0a0e1a" stroke="#2a3550"/>
<rect x="1" y="1" width="898" height="198" rx="16" fill="url(#g)" opacity=".55"/>

<text x="36" y="40" fill="#8a96b0" font-size="10.5" letter-spacing="2.2">LANGUAGE SIGNAL</text>
<text x="36" y="64" fill="#e6edf7" font-size="19">What the code is made of</text>
