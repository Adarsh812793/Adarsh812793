<rect x="36.0" y="92" width="559.9" height="12" rx="3" fill="#f1e05a" style="transform-origin:36px 92px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.2s both"/><rect x="597.9" y="92" width="108.0" height="12" rx="3" fill="#3178c6" style="transform-origin:36px 92px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.28s both"/><rect x="707.8" y="92" width="100.7" height="12" rx="3" fill="#663399" style="transform-origin:36px 92px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.36s both"/><rect x="810.6" y="92" width="19.9" height="12" rx="3" fill="#3572A5" style="transform-origin:36px 92px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.44s both"/><rect x="832.5" y="92" width="13.7" height="12" rx="3" fill="#DA5B0B" style="transform-origin:36px 92px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.52s both"/><rect x="848.2" y="92" width="12.6" height="12" rx="3" fill="#a91e50" style="transform-origin:36px 92px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.6000000000000001s both"/>
