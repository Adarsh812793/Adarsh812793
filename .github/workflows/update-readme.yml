name: Update profile README

on:
  schedule:
    - cron: "17 0 * * *"   # daily at 05:47 IST
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards from live GitHub data
        env:
          # Optional: add a secret GH_PAT (classic token, read:user scope) to include private contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh live profile cards"
          git push
